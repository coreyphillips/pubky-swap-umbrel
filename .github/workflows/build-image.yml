name: build-image

# Publishes the multi-arch image an installed app pulls. Nothing is compiled on a user's node.
#
# Tag-driven, because the tag is what the app version and the image tag are derived from: they
# have to move together or Umbrel shows one version and installs another. workflow_dispatch is
# here for the bootstrap, and for rebuilding a version against a fixed upstream commit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (defaults to the app version in the manifest)"
        required: false
      pubky_swap_ref:
        description: "pubky-swap git ref to build from"
        required: false
        default: "main"

env:
  IMAGE: ghcr.io/coreyphillips/pubky-swap-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and the upstream ref
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep -oE '^version: *"[^"]+"' pubky-swap/umbrel-app.yml | sed 's/.*"\(.*\)"/\1/')
          fi
          REF="${{ github.event.inputs.pubky_swap_ref }}"
          [ -n "$REF" ] || REF=main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from pubky-swap@$REF"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PUBKY_SWAP_REF=${{ steps.meta.outputs.ref }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest

      # The digest is what the compose file has to name. Printing it here is what makes the
      # release PR a copy and paste rather than a lookup.
      - name: The line to put in pubky-swap/docker-compose.yml
        run: |
          echo "image: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}@${{ steps.push.outputs.digest }}"
