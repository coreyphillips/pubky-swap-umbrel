name: build-image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pubky_swap_ref:
        description: "pubky-swap commit or tag to build the engine from"
        required: false
        default: ""

env:
  IMAGE: ghcr.io/coreyphillips/pubky-swap-app
  # The pubky-swap commit the engine is built from, decoupled from the app's own version because
  # the two move independently. Pinned to a commit rather than a branch so a rebuild produces the
  # app that was tested rather than whatever main happens to be.
  #
  # 5192e63 is the merge of #36, which is what makes a swap work at all against stock settings:
  # the provider's hold invoice used to expire before its own counterparty would accept it, so
  # every reverse swap was refused at the invoice step, and a second run against the same provider
  # read the first run's quote out of the conversation history and refused it as expired.
  PUBKY_SWAP_REF: "5192e63227bec3bf03166f9007681180bdd1fbf6"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          REF="${{ github.event.inputs.pubky_swap_ref }}"
          [ -n "$REF" ] || REF="${{ env.PUBKY_SWAP_REF }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubky_swap_ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Umbrel runs on both, and a Raspberry Pi is the likelier of the two.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PUBKY_SWAP_REF=${{ steps.meta.outputs.pubky_swap_ref }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
