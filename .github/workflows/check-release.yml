name: check-release

# umbrelOS installs this app straight from `main`. The moment a commit lands there, every Umbrel
# that syncs the store tries to pull the image named in docker-compose.yml. If that image does not
# exist, the pull fails, the container is never created, and app_proxy waits forever on a backend
# that will never appear: the app hangs on "Starting" with no way to tell why.
#
# The image is built from a git tag, so it can only exist after the tag is pushed. Requiring the
# compose file to name it by digest closes the gap: a digest cannot be known until the image is
# published, so a digest that resolves is proof the image is there. This enforces that, and blocks
# the merge rather than reporting the breakage after users have hit it.
#
# The release order it implies:
#   1. merge the code, leaving `version` and the image alone
#   2. tag it, and let build-image publish the image (it prints the line to paste)
#   3. open a second PR bumping `version` plus the image tag and digest together
#
# Step 3 is the only commit that changes what Umbrel is told to install, and it cannot pass this
# check until the thing it points at is real.

on:
  pull_request:
    branches: [main]
    paths:
      - "pubky-swap/docker-compose.yml"
      - "pubky-swap/umbrel-app.yml"
      - ".github/workflows/check-release.yml"
      - ".github/scripts/*.cjs"
      - "docs/STORAGE_MIGRATION.md"
  push:
    branches: [main]

jobs:
  image-exists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test release validation and migration safety without network access
        run: node --test .github/scripts/*.test.cjs

      - name: Verify the published tag, digest and both runnable architectures
        run: node .github/scripts/check-release.cjs
