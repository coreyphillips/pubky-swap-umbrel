<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Pubky Swap</title>
<link rel="icon" href="/icon.svg" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<!-- No inline styles or scripts anywhere in this file: the Content-Security-Policy has no
     'unsafe-inline', which is a structural backstop against markup injection in a panel that can
     move funds. -->
<div class="ambient" aria-hidden="true"></div>

<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <img src="/icon.svg" alt="" width="26" height="26" />
      <span>Pubky Swap</span>
    </div>
    <div class="appbar-state" id="appbarState"></div>
    <div class="appbar-right">
      <div id="identityChip"></div>
      <span class="freshness" id="freshness"></span>
    </div>
  </div>
  <nav class="tabbar" aria-label="Sections">
    <div class="tabbar-inner" id="tabbar" role="tablist">
      <span class="tab-underline" id="tabUnderline"></span>
    </div>
  </nav>
</header>

<main class="page" id="page">
  <div id="banner" class="banner-slot"></div>
  <div id="panels"></div>
</main>

<div id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
<div id="modalRoot"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
