releaseNotes: >-
  A rebuilt control panel, and the fixes it took to make one worth building.


  The app could not start at all against a current swap engine: it passed two flags that had been
  removed on purpose, because a value on a command line is readable by anything that can see the
  process table. Secrets now live in owner-only files and the engine is told where they are, never
  what they say. An existing plaintext config is migrated and removed on first start.


  Your own swaps were writing their records inside the container instead of onto the app's volume.
  A submarine swap's refund key is generated there and exists nowhere else, so losing it makes the
  coins unspendable by anyone. Records left behind by the old build are recovered on start.


  The panel is now tabs: what your node is doing, what you have earned, swapping your own funds,
  every swap you have been part of, and settings. Everything it reports comes from the engine's own
  status API rather than from reading its logs. Setup asks what you want to use this for before
  anything else, so choosing to swap your own funds no longer starts you advertising to the network.
path: ""
