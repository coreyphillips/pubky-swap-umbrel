manifestVersion: 1
id: pubky-swap
category: lightning
name: Pubky Swap
version: "0.1.0"
tagline: Run a self-hosted Lightning↔on-chain swap provider on your own node
icon: https://raw.githubusercontent.com/coreyphillips/pubky-swap-umbrel/main/icon.svg
port: 3737
description: >-
  Turn your node into a **decentralized Lightning swap provider.** Pubky Swap advertises submarine
  (on-chain → Lightning) and reverse (Lightning → on-chain) swaps at the rates you set, and
  facilitates them using **your Umbrel's own LND node and Electrs** — there is no central swap
  server. Discovery and negotiation ride on the Pubky network.


  Just load your Pubky identity, set your fee rate and limits, and save — the provider starts
  advertising and serving swaps. Share the Pubky it prints with anyone who wants to swap with you.


  ⚠️ EARLY SOFTWARE — NOT YET AUDITED. The swap engine is implemented and tested (including
  end-to-end on regtest against real LND), but it has not had a third-party security review and
  mainnet hardening is ongoing. Atomic-swap bugs can lose funds. Start small and only risk what you
  can afford to lose.
developer: Corey Phillips
website: https://github.com/coreyphillips/pubky-swap
submitter: Corey Phillips
submission: https://github.com/coreyphillips/pubky-swap-umbrel
repo: https://github.com/coreyphillips/pubky-swap-umbrel
support: https://github.com/coreyphillips/pubky-swap/issues
dependencies:
  - lightning
  - electrs
releaseNotes: >-
  Initial release. Web UI to load your Pubky, set swap rates/limits, and run a provider against your
  Umbrel's LND + Electrs. Submarine and reverse swaps supported.
path: ""
