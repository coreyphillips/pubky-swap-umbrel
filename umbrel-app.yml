manifestVersion: 1
id: pubky-swap
category: lightning
name: Pubky Swap
version: "0.2.0"
tagline: Earn fees swapping Lightning and on-chain bitcoin on your own node
icon: https://raw.githubusercontent.com/coreyphillips/pubky-swap-umbrel/main/icon.svg
port: 3737
description: >-
  Turn your node into a **decentralized Lightning swap provider.** Pubky Swap advertises submarine
  (on-chain to Lightning) and reverse (Lightning to on-chain) swaps at the rates you set, and
  facilitates them using **your Umbrel's own LND node and Electrs**. There is no central swap
  server; discovery and negotiation ride on the Pubky network.


  Load a Pubky identity, set your rates, and the guided setup checks your node before anything
  starts. Share the pubky it gives you with anyone who wants to swap with you. You can also use it
  the other way round: paste someone else's pubky and swap your own funds, without advertising
  anything.


  Reverse swaps are funded from LND's own on-chain balance, so there is no second seed to back up.
  Just keep some on-chain liquidity in LND.


  ⚠️ EARLY SOFTWARE, NOT YET AUDITED. The swap engine is implemented and tested, including end to
  end on regtest against real LND, but it has not had a third-party security review. A bug in an
  atomic swap can lose money. Start small and only risk what you can afford to lose.
