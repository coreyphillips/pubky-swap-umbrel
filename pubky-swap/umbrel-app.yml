dependencies:
  # Only LND. The Electrum server is chosen in the app, not declared here.
  #
  # Declaring `electrs` makes umbrelOS require that specific app. Fulcrum and ElectrumX say
  # `implements: electrs`, and recent umbrelOS offers them as alternatives at install time, but an
  # older one does not: it simply refuses to install without Electrs, which is not a choice anyone
  # running Fulcrum should have to make. Umbrel's app network is shared, so this app can reach
  # whichever server is installed without declaring anything.
  - lightning
releaseNotes: >-
  A newer swap engine, and the one panel change it asked for.


  Swaps that used to be given up on now keep going. A submarine swap whose payment call broke after
  your node had already accepted the payment was marked failed with the money still committed; it
  now asks your node what actually happened and carries on. So does one resumed near its claim
  deadline. A reverse swap being recovered starts one driver however many times the request is
  replayed, and no swap can hold two reservations at once, which used to leave part of your
  exposure committed for as long as the daemon ran.


  A request your provider could not handle is no longer thrown away. It used to be consumed on the
  first error, so the person who sent it waited for a reply that was never coming. A quote request
  naming an offer that has just been replaced now gets a refusal instead of silence, and a busy
  moment no longer turns new clients away while the quote cache is full.


  Paying a hold invoice no longer holds up everything else your provider is doing with your node.


  People whose Pubky identity lives in a mobile app can swap with you now. Providers offer the
  scoped-session protocol alongside the doorbell, which this app has always answered.


  Setting up reads your pubky from a different part of the engine. It moved because recovering a
  funded swap must not depend on the Pubky identity that started it, only on the records this app
  keeps, and those records are the only thing that can finish it.
