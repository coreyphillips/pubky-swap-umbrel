releaseNotes: >-
  Works with Fulcrum and ElectrumX as well as Electrs, whichever you have installed. The Electrum
  port now comes from Umbrel rather than being assumed: Electrs listens on 50001 and Fulcrum on
  50002, so the assumption reached one and silently failed to reach the other.


  Previously:
  First release. The app installs from a published multi-arch image rather than compiling on your
  node.


  Your Pubky recovery phrase never reaches the swap daemon's command line: it is written to a file
  only the app can read, and passed by name. Anything that can read the process table on a node can
  read another process's arguments.


  The dashboard reads the daemon's own status API instead of matching patterns against its log
  output, so health, in-flight swaps, exposure against your limits and earnings are what the daemon
  reports rather than what a regex inferred.


  This version ships fixes for ten defects an adversarial audit found in the swap engine, four of
  which could lose funds, each with a regression test. See the pubky-swap changelog for detail.
