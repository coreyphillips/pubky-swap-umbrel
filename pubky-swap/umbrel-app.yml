manifestVersion: 1
id: pubky-swap
category: bitcoin
name: Pubky Swap
version: "0.2.4"
tagline: Run a self-hosted Lightning to on-chain swap provider on your own node
icon: https://raw.githubusercontent.com/coreyphillips/pubky-swap-umbrel/main/pubky-swap/icon.svg
gallery:
  - https://raw.githubusercontent.com/coreyphillips/pubky-swap-umbrel/main/pubky-swap/gallery/1.png
  - https://raw.githubusercontent.com/coreyphillips/pubky-swap-umbrel/main/pubky-swap/gallery/2.png
  - https://raw.githubusercontent.com/coreyphillips/pubky-swap-umbrel/main/pubky-swap/gallery/3.png
port: 3737
description: >-
  Turn your node into a **decentralized swap provider.** Pubky Swap advertises submarine
  (on-chain to Lightning) and reverse (Lightning to on-chain) swaps at the rates you set, and
  facilitates them using **your Umbrel's own LND node and Electrs**. There is no central swap
  server: discovery and negotiation ride on the Pubky network.


  Load your Pubky identity, set your fees and limits, and save. The provider starts advertising
  and serving swaps, and you share the Pubky it prints with anyone who wants to swap with you.


  The dashboard shows what the daemon is actually doing: which checks pass, what is in flight,
  how much is committed against your limits, and what you have earned.


  ⚠️ EARLY SOFTWARE, NOT YET AUDITED. The swap engine is implemented and tested end-to-end on
  regtest against real LND, and every fund-touching path has regression tests. It has **not** had
  a third-party security review. Atomic-swap bugs can lose funds. Start with small limits and only
  risk what you can afford to lose.
developer: Corey Phillips
website: https://github.com/coreyphillips/pubky-swap
submitter: Corey Phillips
submission: https://github.com/coreyphillips/pubky-swap-umbrel
repo: https://github.com/coreyphillips/pubky-swap-umbrel
support: https://github.com/coreyphillips/pubky-swap/issues
dependencies:
  # Only LND. The Electrum server is chosen in the app, not declared here.
  #
  # Declaring `electrs` makes umbrelOS require that specific app. Fulcrum and ElectrumX say
  # `implements: electrs`, and recent umbrelOS offers them as alternatives at install time, but an
  # older one does not: it simply refuses to install without Electrs, which is not a choice anyone
  # running Fulcrum should have to make. Umbrel's app network is shared, so this app can reach
  # whichever server is installed without declaring anything.
  - lightning
releaseNotes: >-
  Connect Bitkit to your provider from the Overview with one scan. The new Connect card shows a
  QR code, a copyable connection link, and an Open in Bitkit action for use on the same phone.


  The code includes only your public provider identity and Bitcoin network. It is generated on
  your node and appears once the running provider reports a matching identity and network.


  Use a Bitkit build with Pubky Swap connection-link support. Scanning saves your provider,
  enables Pubky Swap, and opens the Pubky Ring identity picker when an identity is needed.


  The dashboard's diagnostic version now matches this release. Existing settings, identity,
  funding-wallet data, and swap recovery records stay in the app's persistent data volume.
path: ""
defaultUsername: ""
defaultPassword: ""
